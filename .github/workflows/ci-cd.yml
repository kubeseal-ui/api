name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Run unit tests
      run: go test -v -race -coverprofile=coverage.out ./...
      env:
        TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.out
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

    # Build golangci-lint from source with this job's Go toolchain rather than
    # letting golangci-lint-action install a binary. A linter built by an older
    # Go cannot decode the export data that Go 1.27's standard library emits,
    # and typecheck fails on fmt/os/strings/flag before any project package is
    # read:
    #   cannot decode "internal/goarch", export data version 5 is greater
    #   than maximum supported version 4
    # GOTOOLCHAIN=local pins the build to the Go that setup-go installed above.
    - name: Install golangci-lint
      env:
        GOTOOLCHAIN: local
      run: |
        go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Run linter
      run: golangci-lint run ./...

  build:
    name: Build & Test Build
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Build binary
      run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o kubeseal-api ./cmd/server

    - name: Verify binary runs
      run: ./kubeseal-api --help || true

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Set short git commit SHA
      id: vars
      run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          VERSION=${{ github.ref_name }}-${{ steps.vars.outputs.short_sha }}
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha,scope=${{ github.workflow }}
        cache-to: type=gha,mode=max,scope=${{ github.workflow }}

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Run Gosec security scanner
      uses: securego/gosec@master
      with:
        args: '-fmt=json ./...'

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [docker, security]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Generate changelog
      run: |
        git log --pretty=format:'- %s (%an)' $(git describe --tags --abbrev=0 HEAD^)..HEAD > CHANGELOG.md || echo "No previous tag" > CHANGELOG.md

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: CHANGELOG.md
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
