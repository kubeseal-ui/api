# .golangci.yml - golangci-lint configuration for kubeseal-ui api
# Standardized across kubeseal-ui repos to match the Pamawas convention.
# See https://golangci-lint.run/docs/configuration/ for all options.
version: "2"

linters:
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unparam
    - noctx
    - rowserrcheck
    - gocyclo
    - gocognit
  settings:
    gosec:
      excludes:
        - G104 # Ignore unhandled errors (we handle errors explicitly)
        - G115 # Ignore math/big.Int in tests
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable:
        - shadow
    staticcheck:
      checks: ["all", "-ST1000"]
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - goconst
          - unparam
          - lll
          - errcheck
          - govet
          - ineffassign
          - noctx
          - unused
          - staticcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
  modules-download-mode: readonly
